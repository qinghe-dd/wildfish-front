<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>野钓时光 - 小程序图标生成</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            background: #f5f5f5;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
        }
        .preview {
            display: flex;
            gap: 30px;
            justify-content: center;
            align-items: flex-start;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }
        .icon-wrapper {
            text-align: center;
        }
        .icon-label {
            margin-top: 10px;
            color: #666;
            font-size: 14px;
        }
        canvas {
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .download-btn {
            display: block;
            margin: 20px auto;
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .download-btn:hover {
            transform: scale(1.05);
        }
        .tips {
            background: #f0f7ff;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #4A90E2;
            margin-top: 20px;
        }
        .tips h3 {
            margin-top: 0;
            color: #4A90E2;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎣 野钓时光 - 小程序图标</h1>

        <div class="preview">
            <div class="icon-wrapper">
                <canvas id="icon144" width="144" height="144"></canvas>
                <div class="icon-label">144×144px（推荐）</div>
            </div>
            <div class="icon-wrapper">
                <canvas id="icon512" width="512" height="512"></canvas>
                <div class="icon-label">512×512px（高清）</div>
            </div>
        </div>

        <button class="download-btn" onclick="downloadIcon()">📥 下载图标</button>

        <div class="tips">
            <h3>📌 使用说明</h3>
            <p>1. 点击"下载图标"按钮，将保存为 PNG 格式</p>
            <p>2. 图片尺寸：144×144px，符合微信小程序要求</p>
            <p>3. 文件大小：约 20-30KB，远低于 200KB 限制</p>
            <p>4. 设计元素：日落天空 + 山水剪影 + 钓鱼人</p>
        </div>

        <div class="tips">
            <h3>🎨 设计说明</h3>
            <p><strong>配色方案：</strong></p>
            <ul>
                <li>天空渐变：日落橙 (#FF9A56) → 天空蓝 (#4A90E2)</li>
                <li>剪影色：深灰蓝 (#2C3E50)</li>
                <li>点缀色：夕阳金 (#FFD93D)</li>
            </ul>
            <p><strong>寓意：</strong>享受钓鱼的慢时光，亲近自然</p>
        </div>
    </div>

    <script>
        // 绘制图标
        function drawIcon(canvas, size) {
            const ctx = canvas.getContext('2d');
            const scale = size / 144;

            // 背景渐变（日落天空）
            const gradient = ctx.createLinearGradient(0, 0, 0, size);
            gradient.addColorStop(0, '#FF9A56');  // 橙色
            gradient.addColorStop(0.4, '#87CEEB');  // 天蓝
            gradient.addColorStop(1, '#4A90E2');  // 深蓝

            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, size, size);

            // 太阳
            ctx.beginPath();
            ctx.arc(size * 0.75, size * 0.25, size * 0.12, 0, Math.PI * 2);
            ctx.fillStyle = '#FFD93D';
            ctx.fill();

            // 远山剪影（三层）
            const drawMountain = (height, yOffset, color) => {
                ctx.beginPath();
                ctx.moveTo(0, size);
                ctx.lineTo(0, size * yOffset);
                ctx.quadraticCurveTo(size * 0.25, size * (yOffset - height * 0.3),
                                      size * 0.5, size * yOffset);
                ctx.quadraticCurveTo(size * 0.75, size * (yOffset + height * 0.1),
                                      size, size * (yOffset - height * 0.2));
                ctx.lineTo(size, size);
                ctx.closePath();
                ctx.fillStyle = color;
                ctx.fill();
            };

            drawMountain(0.15, 0.75, '#3D5A80');  // 远山
            drawMountain(0.12, 0.82, '#2C3E50');  // 中山
            drawMountain(0.10, 0.88, '#1A252F');  // 近山

            // 水面
            ctx.fillStyle = 'rgba(64, 130, 180, 0.4)';
            ctx.fillRect(0, size * 0.88, size, size * 0.12);

            // 钓鱼人（使用明亮对比色）
            const drawFisherman = (x, y, s) => {
                const personColor = '#2C3E50'; // 深灰蓝，更明亮
                const rodColor = '#8B4513';    // 棕色钓竿

                // 小凳子
                ctx.fillStyle = '#5D4037';
                ctx.fillRect(x - s * 5, y + s * 17, s * 12, s * 3);

                // 身体（坐姿）
                ctx.fillStyle = personColor;
                ctx.beginPath();
                ctx.moveTo(x - s * 5, y + s * 7);
                ctx.lineTo(x - s * 5, y + s * 17);
                ctx.lineTo(x + s * 4, y + s * 17);
                ctx.lineTo(x + s * 4, y + s * 7);
                ctx.closePath();
                ctx.fill();

                // 头部（圆形，稍大）
                ctx.beginPath();
                ctx.arc(x - s * 0.5, y - s * 2, s * 6.5, 0, Math.PI * 2);
                ctx.fill();

                // 钓竿（加粗，棕色，更明显）
                ctx.beginPath();
                ctx.moveTo(x + s * 4, y + s * 7);
                ctx.quadraticCurveTo(x + s * 25, y - s * 15, x + s * 50, y);
                ctx.strokeStyle = rodColor;
                ctx.lineWidth = s * 2.5;
                ctx.lineCap = 'round';
                ctx.stroke();

                // 鱼线（白色，更清晰）
                ctx.beginPath();
                ctx.moveTo(x + s * 50, y);
                ctx.lineTo(x + s * 52, y + s * 30);
                ctx.strokeStyle = '#FFFFFF';
                ctx.lineWidth = s * 1.2;
                ctx.stroke();

                // 鱼漂（大而明显）
                ctx.beginPath();
                ctx.arc(x + s * 52, y + s * 28, s * 2.5, 0, Math.PI * 2);
                ctx.fillStyle = '#FF5722'; // 鲜艳的橙红色
                ctx.fill();
                ctx.strokeStyle = '#FFFFFF';
                ctx.lineWidth = s * 0.8;
                ctx.stroke();

                // 跳出的鱼（白色剪影）
                const drawFish = (fx, fy, fs) => {
                    ctx.fillStyle = '#FFFFFF';
                    ctx.beginPath();
                    // 鱼身
                    ctx.ellipse(fx, fy, fs * 6, fs * 3, -0.3, 0, Math.PI * 2);
                    ctx.fill();
                    // 鱼尾
                    ctx.beginPath();
                    ctx.moveTo(fx - fs * 5, fy);
                    ctx.lineTo(fx - fs * 9, fy - fs * 3);
                    ctx.lineTo(fx - fs * 9, fy + fs * 3);
                    ctx.closePath();
                    ctx.fill();
                };

                // 在鱼漂附近画一条小鱼
                drawFish(x + s * 60, y + s * 25, s * 0.8);
            };

            drawFisherman(size * 0.32, size * 0.75, scale);

            // 文字（可选，仅在144px版本显示）
            if (size <= 200) {
                ctx.font = `bold ${12 * scale}px -apple-system, "PingFang SC", "Microsoft YaHei"`;
                ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                ctx.textAlign = 'center';
                ctx.fillText('野钓时光', size / 2, size - 8);
            }
        }

        // 初始化
        const canvas144 = document.getElementById('icon144');
        const canvas512 = document.getElementById('icon512');
        drawIcon(canvas144, 144);
        drawIcon(canvas512, 512);

        // 下载功能
        function downloadIcon() {
            const link = document.createElement('a');
            link.download = '野钓时光-144px.png';
            link.href = canvas144.toDataURL('image/png');
            link.click();

            // 同时下载512px版本
            setTimeout(() => {
                link.download = '野钓时光-512px.png';
                link.href = canvas512.toDataURL('image/png');
                link.click();
            }, 500);
        }
    </script>
</body>
</html>
